server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/okx_pilot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USER:okx_pilot}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
      accept-float-as-int: false
pilot:
  master-key: ${PILOT_MASTER_KEY:}
  ai-allowed-base-urls: ${AI_ALLOWED_BASE_URLS:https://nxaiapp.com/v1,https://api.openai.com/v1,https://api.deepseek.com/v1,https://openrouter.ai/api/v1}
  session-hours: ${PILOT_SESSION_HOURS:168}
  poll-ms: ${PILOT_POLL_MS:15000}
  telegram-token: ${TELEGRAM_BOT_TOKEN:}
  telegram-poll-ms: ${TELEGRAM_POLL_MS:5000}
