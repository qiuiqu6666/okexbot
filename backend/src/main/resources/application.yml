server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/okx_pilot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USER:okx_pilot}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
      accept-float-as-int: false
pilot:
  operator-token: ${PILOT_OPERATOR_TOKEN:}
  okx-key: ${OKX_API_KEY:}
  okx-secret: ${OKX_SECRET_KEY:}
  okx-passphrase: ${OKX_PASSPHRASE:}
  ai-base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  ai-key: ${AI_API_KEY:}
  ai-model: ${AI_MODEL:}
  poll-ms: ${PILOT_POLL_MS:15000}
